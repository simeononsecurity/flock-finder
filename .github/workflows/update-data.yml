name: Update Flock Camera Data

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      country:
        description: 'Country filter (e.g., US). Leave empty for worldwide.'
        required: false
        default: ''
      full_rescan:
        description: 'Force full rescan (ignore incremental state)'
        required: false
        type: boolean
        default: false

# Least privilege at the top level; each job requests only what it needs.
permissions:
  contents: read

concurrency:
  group: "update-data"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # This job commits data back to the repo → needs write to contents only.
    permissions:
      contents: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore scan checkpoints and generated files. A full scan often spans
      # several WiGLE quota windows, so an explicit rescan resumes any active
      # bootstrap campaign instead of discarding its pagination state.
      - name: Restore scan campaign cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            data/full_scan_bootstrap.json
            data/scan_state.json
            data/ssid_scan_state.json
            data/flock_cameras.geojson
            data/flock_cameras.csv
            data/by_oui
            data/scan_stats.json
            data/candidate_ouis.json
            data/ssid_candidate_cameras.geojson
            data/ssid_candidate_cameras.csv
          key: scan-campaign-v2-${{ hashFiles('data/flock_ouis.csv') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scan-campaign-v2-${{ hashFiles('data/flock_ouis.csv') }}-
            scan-campaign-v2-

      # Incremental scans require a hash-verified base snapshot. A missing or
      # corrupt base must stop the run instead of publishing only the current
      # incremental window. Only an explicit full_rescan may start without it.
      - name: Restore verified base snapshot or require explicit full scan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FULL_RESCAN: ${{ github.event.inputs.full_rescan }}
        run: |
          MARKER=data/full_scan_bootstrap.json

          if [ -f "$MARKER" ]; then
            test -s data/scan_state.json || {
              echo "::error::Bootstrap marker exists without scan state" >&2
              exit 1
            }
            BOOTSTRAP_PHASE=$(python3 -c "import json; print(json.load(open('$MARKER'))['phase'])")
            case "$BOOTSTRAP_PHASE" in
              oui_scan|ssid_scan|assets) ;;
              *) echo "::error::Invalid bootstrap phase: $BOOTSTRAP_PHASE" >&2; exit 1 ;;
            esac
            if [ "$BOOTSTRAP_PHASE" != "oui_scan" ]; then
              test -s data/flock_cameras.geojson
              test -s data/flock_cameras.csv
            fi
            echo "[i] resuming full scan campaign at phase $BOOTSTRAP_PHASE"
            echo "BASE_DATASET_STATUS=explicit_full_scan" >> "$GITHUB_ENV"
            echo "RESUME_FULL_SCAN=true" >> "$GITHUB_ENV"
            echo "BOOTSTRAP_PHASE=$BOOTSTRAP_PHASE" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$INPUT_FULL_RESCAN" = "true" ]; then
            echo "[i] starting explicit full scan campaign"
            rm -f data/scan_state.json data/ssid_scan_state.json
            rm -f data/flock_cameras.geojson data/flock_cameras.csv
            rm -rf data/by_oui
            rm -f data/scan_stats.json data/candidate_ouis.json
            rm -f data/ssid_candidate_cameras.geojson data/ssid_candidate_cameras.csv
            python3 -c "import datetime, json, os; json.dump({'phase': 'oui_scan', 'started_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'run_id': os.environ['GITHUB_RUN_ID']}, open('$MARKER', 'w'), indent=2)"
            echo "BASE_DATASET_STATUS=explicit_full_scan" >> "$GITHUB_ENV"
            echo "RESUME_FULL_SCAN=false" >> "$GITHUB_ENV"
            echo "BOOTSTRAP_PHASE=oui_scan" >> "$GITHUB_ENV"
            exit 0
          fi

          RELEASE_DIR="$RUNNER_TEMP/flock-base-release"
          RESTORE_DIR="$RUNNER_TEMP/flock-base-restored"
          mkdir -p "$RELEASE_DIR"
          gh release download data-latest --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$RELEASE_DIR"
          SNAPSHOT_TAG=$(python3 -c "import json; print(json.load(open('$RELEASE_DIR/latest.json'))['release_tag'])")
          ARCHIVE_NAME=$(python3 -c "import json; print(json.load(open('$RELEASE_DIR/latest.json'))['archive']['name'])")
          MANIFEST_NAME=$(python3 -c "import json; print(json.load(open('$RELEASE_DIR/latest.json'))['manifest']['name'])")
          gh release download "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE_NAME" --pattern "$MANIFEST_NAME" \
            --dir "$RELEASE_DIR"
          python3 scripts/package_snapshot.py restore \
            --latest "$RELEASE_DIR/latest.json" \
            --archive "$RELEASE_DIR/$ARCHIVE_NAME" \
            --manifest "$RELEASE_DIR/$MANIFEST_NAME" \
            --output-dir "$RESTORE_DIR" \
            --require data/flock_cameras.geojson \
            --require data/flock_cameras.csv
          cp "$RESTORE_DIR/data/flock_cameras.geojson" data/
          cp "$RESTORE_DIR/data/flock_cameras.csv" data/
          rm -rf data/by_oui
          cp -R "$RESTORE_DIR/data/by_oui" data/
          echo "BASE_DATASET_STATUS=verified_restored_base" >> "$GITHUB_ENV"
          echo "RESUME_FULL_SCAN=false" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_PHASE=incremental" >> "$GITHUB_ENV"
          echo "[i] restored and verified $(du -h data/flock_cameras.geojson | cut -f1) base dataset"

      - name: Record scan start
        run: |
          if [ -f data/full_scan_bootstrap.json ]; then
            SCAN_STARTED_AT=$(python3 -c "import json; print(json.load(open('data/full_scan_bootstrap.json'))['started_at'])")
          else
            SCAN_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "SCAN_STARTED_AT=$SCAN_STARTED_AT" >> "$GITHUB_ENV"

      - name: Query WiGLE for Flock cameras (incremental)
        id: wigle_scan
        if: ${{ env.BOOTSTRAP_PHASE == 'oui_scan' || env.BOOTSTRAP_PHASE == 'incremental' }}
        continue-on-error: true
        env:
          WIGLE_API_NAME: ${{ secrets.WIGLE_API_NAME }}
          WIGLE_API_TOKEN: ${{ secrets.WIGLE_API_TOKEN }}
          INPUT_COUNTRY: ${{ github.event.inputs.country }}
          INPUT_FULL_RESCAN: ${{ github.event.inputs.full_rescan }}
        run: |
          ARGS=()
          if [ -n "$INPUT_COUNTRY" ]; then
            ARGS+=(--country "$INPUT_COUNTRY")
          fi
          if [ "$INPUT_FULL_RESCAN" = "true" ] && [ "$RESUME_FULL_SCAN" != "true" ]; then
            ARGS+=(--full-rescan)
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS+=(--rebuild-if-due)
          fi
          python3 scripts/wigle_query.py "${ARGS[@]}"

      - name: Advance bootstrap campaign to SSID scan
        if: ${{ steps.wigle_scan.outcome == 'success' && env.BOOTSTRAP_PHASE == 'oui_scan' }}
        run: |
          python3 -c "import json; p='data/full_scan_bootstrap.json'; d=json.load(open(p)); d['phase']='ssid_scan'; json.dump(d, open(p, 'w'), indent=2)"
          echo "BOOTSTRAP_PHASE=ssid_scan" >> "$GITHUB_ENV"

      - name: Save scan campaign checkpoint after OUI scan
        if: ${{ always() && steps.wigle_scan.outcome != 'skipped' }}
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            data/full_scan_bootstrap.json
            data/scan_state.json
            data/ssid_scan_state.json
            data/flock_cameras.geojson
            data/flock_cameras.csv
            data/by_oui
            data/scan_stats.json
            data/candidate_ouis.json
            data/ssid_candidate_cameras.geojson
            data/ssid_candidate_cameras.csv
          key: scan-campaign-v2-${{ hashFiles('data/flock_ouis.csv') }}-checkpoint-oui-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop after incomplete scan campaign
        if: ${{ steps.wigle_scan.outcome == 'failure' }}
        run: |
          echo "::error::WiGLE OUI scan is incomplete. Checkpoint saved for the next run." >&2
          exit 1

      - name: Update SSID stats in README and website
        run: python3 scripts/update_ssid_stats.py

      - name: Query WiGLE by SSID patterns for novel OUI discovery
        id: ssid_scan
        if: ${{ env.BOOTSTRAP_PHASE != 'assets' }}
        continue-on-error: true
        env:
          WIGLE_API_NAME: ${{ secrets.WIGLE_API_NAME }}
          WIGLE_API_TOKEN: ${{ secrets.WIGLE_API_TOKEN }}
        run: python3 scripts/ssid_query.py

      - name: Advance bootstrap campaign to asset build
        if: ${{ steps.ssid_scan.outcome == 'success' && env.BOOTSTRAP_PHASE == 'ssid_scan' }}
        run: |
          python3 -c "import json; p='data/full_scan_bootstrap.json'; d=json.load(open(p)); d['phase']='assets'; json.dump(d, open(p, 'w'), indent=2)"
          echo "BOOTSTRAP_PHASE=assets" >> "$GITHUB_ENV"

      - name: Save scan campaign checkpoint after SSID scan
        if: ${{ always() && steps.ssid_scan.outcome != 'skipped' }}
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            data/full_scan_bootstrap.json
            data/scan_state.json
            data/ssid_scan_state.json
            data/flock_cameras.geojson
            data/flock_cameras.csv
            data/by_oui
            data/scan_stats.json
            data/candidate_ouis.json
            data/ssid_candidate_cameras.geojson
            data/ssid_candidate_cameras.csv
          key: scan-campaign-v2-${{ hashFiles('data/flock_ouis.csv') }}-checkpoint-ssid-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop after incomplete SSID scan campaign
        if: ${{ steps.ssid_scan.outcome == 'failure' }}
        run: |
          echo "::error::WiGLE SSID scan is incomplete. Checkpoint saved for the next run." >&2
          exit 1

      # Render the evidence-tier headline (README stats + website hero chips) from
      # the CSV the scan just wrote. Single writer of those blocks — the collector
      # no longer renders them itself (see the note in scripts/wigle_query.py).
      - name: Render confidence headline from the dataset
        run: python3 scripts/update_confidence_stats.py

      # Validate the freshly generated artifacts while they are present in this
      # job — the big files are not committed, so PR CI can only validate the
      # small tracked ones (see .github/workflows/ci.yml).
      - name: Validate generated data artifacts
        run: python3 scripts/validate_data.py

      - name: Build pinned Tippecanoe
        env:
          TIPPECANOE_COMMIT: 68ab8dcc229f95b8b25877697d5e8d66783af503
          TIPPECANOE_RELEASE: 2.79.0
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc g++ make libsqlite3-dev zlib1g-dev
          git clone --filter=blob:none https://github.com/felt/tippecanoe.git \
            "$RUNNER_TEMP/tippecanoe"
          git -C "$RUNNER_TEMP/tippecanoe" checkout --detach "$TIPPECANOE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/tippecanoe" rev-parse HEAD)" = "$TIPPECANOE_COMMIT"
          make -C "$RUNNER_TEMP/tippecanoe" -j2
          TIPPECANOE_VERSION=$("$RUNNER_TEMP/tippecanoe/tippecanoe" --version)
          case "$TIPPECANOE_VERSION" in
            *"$TIPPECANOE_RELEASE"*) ;;
            *) echo "unexpected Tippecanoe version: $TIPPECANOE_VERSION" >&2; exit 1 ;;
          esac
          echo "$RUNNER_TEMP/tippecanoe" >> "$GITHUB_PATH"
          echo "TIPPECANOE_VERSION=$TIPPECANOE_VERSION" >> "$GITHUB_ENV"
          echo "TIPPECANOE_COMMIT=$TIPPECANOE_COMMIT" >> "$GITHUB_ENV"

      - name: Build fresh browser map assets
        run: |
          rm -f docs/assets/flock-cameras.pmtiles docs/assets/flock-cameras.pmtiles.tmp
          rm -rf docs/assets/bssid
          node docs/assets/build-map-assets.mjs \
            data/flock_cameras.geojson data/flock_ouis.json docs/assets
          test -s docs/assets/flock-cameras.pmtiles
          test -d docs/assets/bssid
          test "$(find docs/assets/bssid -type f -name '*.json' | wc -l)" -gt 0

      - name: Build immutable snapshot package
        id: snapshot
        run: |
          python3 scripts/package_snapshot.py build \
            --data-dir data \
            --output-dir "$RUNNER_TEMP/flock-snapshot" \
            --source-commit "$GITHUB_SHA" \
            --scan-started-at "$SCAN_STARTED_AT" \
            --base-status "$BASE_DATASET_STATUS" \
            --repository "$GITHUB_REPOSITORY" \
            --extra-artifact-root docs/assets \
            --require-map-assets \
            --tippecanoe-version "$TIPPECANOE_VERSION" \
            --tippecanoe-source-commit "$TIPPECANOE_COMMIT" \
            --map-asset-builder docs/assets/build-map-assets.mjs \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish immutable snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.release_tag }}
          SNAPSHOT_ARCHIVE: ${{ steps.snapshot.outputs.archive }}
          SNAPSHOT_MANIFEST: ${{ steps.snapshot.outputs.manifest }}
          SNAPSHOT_CHECKSUMS: ${{ steps.snapshot.outputs.checksums }}
        run: |
          if gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-snapshot"
            gh release download "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$(basename "$SNAPSHOT_CHECKSUMS")" \
              --dir "$RUNNER_TEMP/existing-snapshot"
            cmp "$SNAPSHOT_CHECKSUMS" \
              "$RUNNER_TEMP/existing-snapshot/$(basename "$SNAPSHOT_CHECKSUMS")"
          else
            gh release create "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Flock Finder data snapshot ${{ steps.snapshot.outputs.snapshot_id }}" \
              --notes "Immutable generated-data snapshot. Verify the archive and manifest with the attached SHA-256 file. Source rights and unresolved redistribution questions are recorded in DATA_LICENSE." \
              "$SNAPSHOT_ARCHIVE" "$SNAPSHOT_MANIFEST" "$SNAPSHOT_CHECKSUMS"
          fi

      # Preserve the existing download names while pointing consumers to the
      # uniquely tagged, hash-verified snapshot release.
      - name: Update rolling release and latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_POINTER: ${{ steps.snapshot.outputs.latest_pointer }}
        run: |
          (cd data && zip -qr /tmp/by_oui.zip by_oui)
          gh release view data-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create data-latest --repo "$GITHUB_REPOSITORY" \
              --title "Flock Finder dataset (rolling)" \
              --notes "Mutable compatibility downloads. latest.json identifies the immutable snapshot release and hashes. Source rights and unresolved questions are recorded in DATA_LICENSE."
          gh release upload data-latest --repo "$GITHUB_REPOSITORY" --clobber \
            data/flock_cameras.geojson data/flock_cameras.csv /tmp/by_oui.zip \
            "$LATEST_POINTER"

      - name: Complete scan campaign
        run: rm -f data/full_scan_bootstrap.json

      - name: Save completed scan state
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            data/full_scan_bootstrap.json
            data/scan_state.json
            data/ssid_scan_state.json
            data/flock_cameras.geojson
            data/flock_cameras.csv
            data/by_oui
            data/scan_stats.json
            data/candidate_ouis.json
            data/ssid_candidate_cameras.geojson
            data/ssid_candidate_cameras.csv
          key: scan-campaign-v2-${{ hashFiles('data/flock_ouis.csv') }}-complete-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check for data changes
        id: check
        run: |
          git diff --quiet data/ README.md docs/index.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the small, diffable artifacts are committed. The dataset itself
          # (flock_cameras.geojson / .csv / by_oui/) is published to the rolling
          # release above and served from Pages — committing a full-rewrite
          # snapshot every day is what grew this repo to 1.6 GB.
          git add data/scan_stats.json data/flock_ouis.csv data/flock_ouis.json \
                  data/ssid_candidate_cameras.geojson data/ssid_candidate_cameras.csv \
                  data/candidate_ouis.json \
                  README.md docs/index.html

          CAMERAS=$(python3 -c "import json; d=json.load(open('data/scan_stats.json')); print(d.get('total_cameras', 0))")
          NEW=$(python3 -c "import json; d=json.load(open('data/scan_stats.json')); print(d.get('new_this_scan', 0))")
          CANDS=$(python3 -c "import json; d=json.load(open('data/candidate_ouis.json')); print(d.get('total_candidates', 0))" 2>/dev/null || echo 0)
          git commit -m "data: update Flock camera data ($CAMERAS total, +$NEW new, ${CANDS} candidate OUIs) [skip ci]"
          git push
