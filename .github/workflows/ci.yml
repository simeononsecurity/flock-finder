name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check scripts tests

      - name: Run unit tests (pytest)
        run: python -m pytest -q

      - name: Regenerate OUI metadata JSON
        run: python3 scripts/oui_metadata.py

      - name: Validate data artifacts against data policy
        run: python3 scripts/validate_data.py

  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned frontend test dependencies
        working-directory: frontend-tests
        run: npm ci

      - name: Install Chromium test runtime
        working-directory: frontend-tests
        run: npx playwright install --with-deps chromium

      - name: Run map, privacy, responsive, and accessibility tests
        working-directory: frontend-tests
        run: npm test
