name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - Update Flock Camera Data
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a queued run finish rather than
# cancelling it so we never leave the site in a half-deployed state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Download one immutable snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/flock-release"
          if ! gh release download data-latest --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$RUNNER_TEMP/flock-release"; then
            echo "::error::No verified immutable snapshot pointer exists. Run Update Flock Camera Data with full_rescan enabled once to create the initial snapshot."
            exit 1
          fi
          SNAPSHOT_TAG=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/flock-release/latest.json'))['release_tag'])")
          ARCHIVE_NAME=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/flock-release/latest.json'))['archive']['name'])")
          MANIFEST_NAME=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/flock-release/latest.json'))['manifest']['name'])")
          gh release download "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE_NAME" --pattern "$MANIFEST_NAME" \
            --dir "$RUNNER_TEMP/flock-release"
          python3 scripts/package_snapshot.py restore \
            --latest "$RUNNER_TEMP/flock-release/latest.json" \
            --archive "$RUNNER_TEMP/flock-release/$ARCHIVE_NAME" \
            --manifest "$RUNNER_TEMP/flock-release/$MANIFEST_NAME" \
            --output-dir "$RUNNER_TEMP/flock-restored" \
            --require data/flock_cameras.geojson \
            --require data/flock_cameras.csv \
            --require docs/assets/flock-cameras.pmtiles \
            --require-glob 'docs/assets/bssid/*.json'

      - name: Restore verified data and map assets
        run: |
          rm -rf data
          cp -R "$RUNNER_TEMP/flock-restored/data" data
          mkdir -p docs/assets
          rm -rf docs/assets/bssid
          cp -R "$RUNNER_TEMP/flock-restored/docs/assets/bssid" docs/assets/
          cp "$RUNNER_TEMP/flock-restored/docs/assets/flock-cameras.pmtiles" docs/assets/
          python3 scripts/version_pages_assets.py \
            --latest "$RUNNER_TEMP/flock-release/latest.json" \
            --docs-dir docs

      - name: Prepare pages content
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp -r data _site/data
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
