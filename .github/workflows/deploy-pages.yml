name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a queued run finish rather than
# cancelling it so we never leave the site in a half-deployed state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The 90 MB dataset is not committed (see .gitignore): restore the current
      # published copy so the site keeps serving /data/… at the same paths.
      - name: Restore published dataset from the rolling release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fy-dataset
          gh release download data-latest --repo "$GITHUB_REPOSITORY" --clobber \
            --pattern 'flock_cameras.geojson' --pattern 'flock_cameras.csv' \
            --dir /tmp/fy-dataset || true
          if [ -f /tmp/fy-dataset/flock_cameras.geojson ]; then
            cp /tmp/fy-dataset/flock_cameras.geojson data/
          else
            echo "::warning::No published dataset found — the map will fall back to its inline sample."
          fi
          if [ -f /tmp/fy-dataset/flock_cameras.csv ]; then
            cp /tmp/fy-dataset/flock_cameras.csv data/
          fi

      - name: Prepare pages content
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp -r data _site/data
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
